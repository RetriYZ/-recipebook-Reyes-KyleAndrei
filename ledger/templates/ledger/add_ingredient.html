{% extends "ledger/base.html" %}

{% block content %}
<h2>Add Ingredient to {{ recipe.name }}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Add Ingredient</button>
</form>

<hr>
<a href="{% url 'ledger:recipe_detail' view.kwargs.pk %}">Finished adding ingredients</a>
{% endblock %}
