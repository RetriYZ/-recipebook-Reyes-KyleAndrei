<!DOCTYPE html>
<html>
<body>
   <header>
        <h1>Recipe Book</h1> 
        <nav>
            {% if user.is_authenticated %}
                <span>Logged in as: {{ user.username }}</span>
                <form method="POST" action="{% url 'ledger:logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form> 
            {% else %}
                {% if request.resolver_match.url_name != 'login' %}
                    <a href="{% url 'ledger:login' %}">Login</a>
                {% endif %}
            {% endif %}
        </nav>
    </header>

    <main>
        <h2>{% block page_heading %}{% endblock %}</h2>
        
        {% block content %}{% endblock %}
    </main>
</body>
</html>
