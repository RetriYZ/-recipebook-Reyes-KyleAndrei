{% extends "ledger/base.html" %}

{% block page_heading %}{% endblock %}

{% block content %}
<h2>All Recipes</h2>

{% if user.is_authenticated %}
    <div>
        <a href="{% url 'ledger:recipe_add' %}" class="btn">Add New Recipe</a>
    </div>
{% endif %}

<ul>
    {% for recipe in recipes %}
        <li><a href="{% url 'ledger:recipe_detail' recipe.pk %}">{{ recipe.title }}</a></li>
    {% endfor %}
</ul>
{% endblock %}
