{% extends "ledger/base.html" %}

{% block page_heading %}Recipe List{% endblock %}

{% block content %}
<h2>All Recipes</h2>
<ul>
    {% for recipe in recipes %}
        <li>
            <a href="{% url 'ledger:recipe_detail' pk=recipe.pk %}">{{ recipe.name }}</a> 
            by {{ recipe.author.name }} </li>
    {% empty %}
        <li>No recipes found.</li>
    {% endfor %}
</ul>
{% endblock %}
